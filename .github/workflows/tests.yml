name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/cpu.txt
            demo/requirements.txt
      - run: pip install -r requirements/cpu.txt -r demo/requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q
      - run: python evaluate.py --pred predictions_samples.json --validate-only
      - run: bash weights/download.sh
      - run: python tools/check_submission.py
