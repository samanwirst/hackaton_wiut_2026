[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = [".venv", "docs/references", "evaluate.py", "run_submission.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # CLI/demo modules intentionally add src/ before importing trafficwatch.
