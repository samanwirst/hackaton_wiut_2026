# Private staging only. Never attach to existing app networks without approval.
name: trafficwatch-demo
services:
  demo:
    image: trafficwatch-demo:20260927
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:17860:7860"
    cpus: 0.75
    cpu_shares: 128
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - cache:/tmp
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/config', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  default:
    internal: true
volumes:
  cache:
