# Opt-in only after permission and private upload verification.
# The gateway joins the existing proxy network; the model container does not.
services:
  gateway:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    cpus: 0.10
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16777216,mode=1777
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [default, proxy]
    depends_on:
      demo:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: apps
      traefik.http.routers.trafficwatch-demo.rule: "Host(`${TRAFFICWATCH_DEMO_HOST:?Set the approved demo hostname}`)"
      traefik.http.routers.trafficwatch-demo.entrypoints: websecure
      traefik.http.routers.trafficwatch-demo.tls.certresolver: letsencrypt
      traefik.http.services.trafficwatch-demo.loadbalancer.server.port: "8080"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  proxy:
    external: true
    name: apps
